name: publish-x-theitsupportguru

on:
  schedule:
    # Daily 05:30 AEST = 19:30 UTC prior day -> single build synthesizes 4 tweets, Ayrshare schedules 06:00/12:00/17:00/20:00 AEST
    - cron: '30 19 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish (bypass random gate)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: AEST Random Gate (max 80/mo, stealth 30% effective)
        env:
          FORCE_PUBLISH: ${{ inputs.force }}
        run: python src/schedule_gate.py
      - name: Ingest RSS (7 niches, 48 feeds, mirrors FacelessStudio)
        if: hashFiles('out/skip_gate') == ''
        run: python src/ingest.py
      - name: Score relevance (X IT admin + tech enthusiast bias)
        if: hashFiles('out/skip_gate') == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/score.py
      - name: Enrich (Tavily)
        if: hashFiles('out/skip_gate') == ''
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python src/enrich.py
      - name: Synthesize X drafts (4 pillars, 280-char, same logic as IG)
        if: hashFiles('out/skip_gate') == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/synthesize.py
      - name: QA grounded check (280-char, hashtag, CVE gate)
        if: hashFiles('out/skip_gate') == ''
        run: python src/qa.py
      - name: Publish X via Ayrshare (AEST jitter 06:12-06:27 + Telegram gate)
        if: hashFiles('out/skip_gate') == ''
        env:
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }}
          CI: "1"
        run: python src/publish.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-draft-${{ github.run_id }}
          path: |
            out/
            drafts/
            out/schedule.json
            out/tweets.json

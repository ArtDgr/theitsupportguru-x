name: publish-x-theitsupportguru

"on":
  schedule:
    # 4x/day AEST Mon-Fri immediate publish (free tier, no scheduleDate): 06:00/12:00/17:00/20:00 AEST = 20:00/02:00/07:00/10:00 UTC
    - cron: '0 20 * * 0-4'  # 06:00 AEST next day (Sun-Thu UTC)
    - cron: '0 2 * * 1-5'   # 12:00 AEST
    - cron: '0 7 * * 1-5'   # 17:00 AEST
    - cron: '0 10 * * 1-5'  # 20:00 AEST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish (bypass random gate)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: AEST Random Gate (max 80/mo, stealth 30% effective)
        env:
          FORCE_PUBLISH: ${{ inputs.force }}
        run: python src/schedule_gate.py
      - name: Ingest RSS (7 niches, 48 feeds, mirrors FacelessStudio)
        if: hashFiles('out/skip_gate') == ''
        run: python src/ingest.py
      - name: Score relevance (X IT admin + tech enthusiast bias)
        if: hashFiles('out/skip_gate') == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/score.py
      - name: Enrich (Tavily)
        if: hashFiles('out/skip_gate') == ''
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python src/enrich.py
      - name: Synthesize X drafts (4 pillars, 280-char, same logic as IG)
        if: hashFiles('out/skip_gate') == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/synthesize.py
      - name: QA grounded check (280-char, hashtag, CVE gate)
        if: hashFiles('out/skip_gate') == ''
        run: python src/qa.py
      - name: Publish X via Ayrshare (AEST jitter 06:12-06:27 + Telegram gate)
        if: hashFiles('out/skip_gate') == ''
        env:
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }}
          CI: "1"
        run: python src/publish.py
      - name: Fallback — Headless Playwright X (no Consumer Key, free tier)
        if: hashFiles('out/skip_gate') == '' && always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Headless X publish (free, no API key)
        if: hashFiles('out/skip_gate') == ''
        env:
          X_COOKIES_B64: ${{ secrets.X_COOKIES_B64 }}
          X_STORAGE_B64: ${{ secrets.X_STORAGE_B64 }}
        run: |
          npm install --silent playwright 2>&1 | tail -n 5
          npx playwright install --with-deps firefox 2>&1 | tail -n 5
          if [ -n "$X_COOKIES_B64" ]; then echo "$X_COOKIES_B64" | base64 -d > /tmp/x-cookies.json; node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/x-cookies.json','utf8')); console.log('cookies loaded', j.length)" || true; fi
          node src/x_headless.js --dry || echo "headless dry-run done"
          if [ "${{ secrets.AUTO_PUBLISH }}" = "1" ]; then node src/x_headless.js || echo "headless publish attempted (needs logged-in profile or X_COOKIES_B64)"; fi
          echo "Headless fallback complete — Ayrshare 169/156 is free-tier schedule or not-linked; headless posts immediately without Consumer Key."
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-draft-${{ github.run_id }}
          path: |
            out/
            drafts/
            out/schedule.json
            out/tweets.json
